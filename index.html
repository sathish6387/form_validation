<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="form_section">
        <form id="contactForm" novalidate>
            <table>
                <tr>
                    <td><label for="name"><span class="label-icon"><i class="fa-solid fa-user"></i></span>Name</label>
                    </td>
                    <td>
                        <input type="text" id="name" required autocomplete="off">
                        <div class="error-message" id="nameError"></div>
                    </td>
                </tr>
                <tr>
                    <td><label for="email"><span class="label-icon"><i
                                    class="fa-solid fa-envelope"></i></span>Email</label></td>
                    <td>
                        <input type="email" id="email" required autocomplete="off">
                        <div class="error-message" id="emailError"></div>
                    </td>
                </tr>
                <tr>
                    <td><label for="phone"><span class="label-icon"><i
                                    class="fa-solid fa-phone"></i></span>Phone</label></td>
                    <td>
                        <input type="tel" id="phone" maxlength="10" required autocomplete="off">
                        <div class="error-message" id="phoneError"></div>
                    </td>
                </tr>
                <tr>
                    <td><label for="message"><span class="label-icon"><i class="fa-solid fa-comments"></i></span>Your
                            Message</label></td>
                    <td>
                        <textarea id="message" rows="4" required autocomplete="off"></textarea>
                        <div class="error-message" id="messageError"></div>
                    </td>
                </tr>
                <tr>
                    <td><button type="reset" class="reset-btn">Reset</button></td>
                    <td><button type="submit" class="submit-btn">Submit</button></td>
                </tr>
            </table>
        </form>
    </section>
    <script>
        const form = document.getElementById('contactForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const messageInput = document.getElementById('message');

        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const phoneError = document.getElementById('phoneError');
        const messageError = document.getElementById('messageError');

        function showError(inputElement, errorElement, message) {
            errorElement.textContent = message;
            inputElement.classList.add('input-error');
        }

        function clearError(inputElement, errorElement) {
            errorElement.textContent = '';
            inputElement.classList.remove('input-error');
        }

        function validateEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function validatePhone(value) {
            return /^\d{10}$/.test(value);
        }

        function validateForm() {
            let isValid = true;

            clearError(nameInput, nameError);
            clearError(emailInput, emailError);
            clearError(phoneInput, phoneError);
            clearError(messageInput, messageError);

            if (!nameInput.value.trim()) {
                showError(nameInput, nameError, 'Please enter your name.');
                isValid = false;
            } else if (nameInput.value.trim().length < 3) {
                showError(nameInput, nameError, 'Name must be at least 3 characters long.');
                isValid = false;
            }

            if (!emailInput.value.trim()) {
                showError(emailInput, emailError, 'Please enter your email.');
                isValid = false;
            } else if (!validateEmail(emailInput.value.trim())) {
                showError(emailInput, emailError, 'Please enter a valid email address.');
                isValid = false;
            }

            if (!phoneInput.value.trim()) {
                showError(phoneInput, phoneError, 'Please enter your phone number.');
                isValid = false;
            } else if (!validatePhone(phoneInput.value.trim())) {
                showError(phoneInput, phoneError, 'Phone number must be 10 digits.');
                isValid = false;
            }

            if (!messageInput.value.trim()) {
                showError(messageInput, messageError, 'Please enter a message.');
                isValid = false;
            } else if (messageInput.value.trim().length < 10) {
                showError(messageInput, messageError, 'Message must be at least 10 characters long.');
                isValid = false;
            }

            return isValid;
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            if (validateForm()) {
                alert('Form submitted successfully!');
                form.reset();
            }
        });
    </script>
</body>

</html>
